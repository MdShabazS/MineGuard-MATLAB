name: Task Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Task gate syntax
        run: node --check scripts/task-gate.mjs
      - name: Validate dependency DAG and evidence
        run: node scripts/task-gate.mjs validate
      - name: List ready tasks
        run: node scripts/task-gate.mjs ready
      - name: Guide portal static checks
        run: |
          node --check portal/core.mjs
          node --check portal/app.mjs
          node --test portal/tests/core.test.mjs
      - name: Scope note
        run: echo 'These checks do NOT execute MATLAB; licensed local MATLAB verification is tracked separately.'
