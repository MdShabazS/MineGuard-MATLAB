name: Task Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check scripts/task-gate.mjs
          node --check scripts/pr-gate.mjs
          node --check scripts/pr-gate-core.mjs
          node --check portal/core.mjs
          node --check portal/app.mjs
      - name: Validate task DAG and evidence
        run: node scripts/task-gate.mjs validate
      - name: Confirm task changes respect target branch dependencies
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/pr-gate.mjs
      - name: Task gate and portal test suites
        run: |
          node --test scripts/tests/*.test.mjs
          node --test portal/tests/*.test.mjs
      - name: List ready tasks
        run: node scripts/task-gate.mjs ready
      - name: Scope note
        run: echo 'Static CI does NOT execute MATLAB, visit Render, or verify science.'
